<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- CSS Framework (Bootstrap) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Cropper.js CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  
  <style>
    .img-container {
      max-height: 500px;
      background-color: #f7f7f7;
      margin-bottom: 15px;
    }
    img { max-width: 100%; }
    .loading { display: none; }
  </style>
</head>
<body class="p-4">

<div class="container">
  <h2 class="mb-4">画像・PDF 変換ツール</h2>

  <!-- タブナビゲーション -->
  <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
    <li class="nav-item"><a class="nav-link active" id="tab1-tab" data-bs-toggle="tab" href="#tab1">① 画像加工＆保存</a></li>
    <li class="nav-item"><a class="nav-link" id="tab2-tab" data-bs-toggle="tab" href="#tab2">② 画像→PDF変換</a></li>
    <li class="nav-item"><a class="nav-link" id="tab3-tab" data-bs-toggle="tab" href="#tab3">③ PDF→画像変換</a></li>
  </ul>

  <div class="tab-content" id="myTabContent">
    
    <!-- ① 画像加工＆保存 -->
    <div class="tab-pane fade show active" id="tab1">
      <div class="mb-3">
        <label class="form-label">画像をアップロード</label>
        <input type="file" class="form-control" id="inputImage1" accept="image/*">
      </div>
      <div class="img-container">
        <img id="imagePreview1" src="">
      </div>
      <div class="mb-3">
        <button class="btn btn-secondary" onclick="cropImage()">トリミング適用</button>
        <button class="btn btn-info" onclick="resetCropper()">リセット</button>
      </div>
      <div class="row g-3 align-items-center">
        <div class="col-auto">
          <select id="saveFormat1" class="form-select">
            <option value="image/jpeg">JPGで保存</option>
            <option value="image/png">PNGで保存</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" onclick="saveCroppedImage()">Googleドライブへ保存</button>
        </div>
      </div>
    </div>

    <!-- ② 画像→PDF変換 -->
    <div class="tab-pane fade" id="tab2">
      <div class="mb-3">
        <label class="form-label">画像をアップロード</label>
        <input type="file" class="form-control" id="inputImage2" accept="image/*">
      </div>
      <button class="btn btn-primary" onclick="convertImgToPdf()">PDFに変換して保存</button>
    </div>

    <!-- ③ PDF→画像変換 -->
    <div class="tab-pane fade" id="tab3">
      <div class="mb-3">
        <label class="form-label">PDFをアップロード (1ページ目を画像化します)</label>
        <input type="file" class="form-control" id="inputPdf3" accept="application/pdf">
      </div>
      <div class="mb-3">
        <canvas id="pdfCanvas" style="border:1px solid #ddd; max-width:100%;"></canvas>
      </div>
      <div class="row g-3 align-items-center">
        <div class="col-auto">
          <select id="saveFormat3" class="form-select">
            <option value="image/jpeg">JPGで保存</option>
            <option value="image/png">PNGで保存</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" onclick="savePdfAsImage()">画像として保存</button>
        </div>
      </div>
    </div>

  </div>
  
  <div id="statusMessage" class="mt-3 alert alert-info" style="display:none;"></div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
  // ------------------------------------------------
  // ① 画像加工ロジック (Cropper.js)
  // ------------------------------------------------
  let cropper;
  const image1 = document.getElementById('imagePreview1');
  
  document.getElementById('inputImage1').addEventListener('change', function(e) {
    const files = e.target.files;
    if (files && files.length > 0) {
      const file = files[0];
      const url = URL.createObjectURL(file);
      image1.src = url;
      
      if (cropper) cropper.destroy();
      cropper = new Cropper(image1, {
        viewMode: 1,
        autoCropArea: 0.8,
      });
    }
  });

  function cropImage() {
    if(!cropper) return;
    // UI上の見た目を反映させるだけ（実際のデータ生成は保存時に行う）
    alert("現在の選択範囲で保存できます。");
  }
  
  function resetCropper() {
    if(cropper) cropper.reset();
  }

  function saveCroppedImage() {
    if (!cropper) return alert("画像を読み込んでください");
    showStatus("保存中...", true);

    const format = document.getElementById('saveFormat1').value; // image/jpeg or image/png
    const canvas = cropper.getCroppedCanvas();
    
    // データURL取得
    const dataUrl = canvas.toDataURL(format);
    const ext = format === 'image/jpeg' ? '.jpg' : '.png';
    const filename = 'edited_image_' + new Date().getTime() + ext;

    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure)
      .saveImageToDrive(dataUrl, filename);
  }

  // ------------------------------------------------
  // ② 画像 -> PDF ロジック
  // ------------------------------------------------
  function convertImgToPdf() {
    const fileInput = document.getElementById('inputImage2');
    if (fileInput.files.length === 0) return alert("画像を選択してください");
    showStatus("PDF変換・保存中...", true);

    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const dataUrl = e.target.result;
      const filename = file.name;
      
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .convertImageToPdfAndSave(dataUrl, filename);
    };
    reader.readAsDataURL(file);
  }

  // ------------------------------------------------
  // ③ PDF -> 画像 ロジック (PDF.js)
  // ------------------------------------------------
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  let pdfDoc = null;
  let pageNum = 1;
  let canvas = document.getElementById('pdfCanvas');
  let ctx = canvas.getContext('2d');

  document.getElementById('inputPdf3').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(file.type !== 'application/pdf') return alert("PDFを選択してください");
    
    const fileReader = new FileReader();
    fileReader.onload = function() {
      const typedarray = new Uint8Array(this.result);
      
      pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
        pdfDoc = pdf;
        renderPage(pageNum);
      });
    };
    fileReader.readAsArrayBuffer(file);
  });

  function renderPage(num) {
    pdfDoc.getPage(num).then(function(page) {
      const scale = 1.5; // 画質調整
      const viewport = page.getViewport({scale: scale});
      
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      page.render(renderContext);
    });
  }

  function savePdfAsImage() {
    if (!pdfDoc) return alert("PDFを読み込んでください");
    showStatus("画像保存中...", true);

    const format = document.getElementById('saveFormat3').value;
    const dataUrl = canvas.toDataURL(format);
    const ext = format === 'image/jpeg' ? '.jpg' : '.png';
    const filename = 'pdf_converted_' + new Date().getTime() + ext;

    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure)
      .saveImageToDrive(dataUrl, filename);
  }

  // ------------------------------------------------
  // 共通ハンドラ
  // ------------------------------------------------
  function showStatus(msg, isProcessing) {
    const el = document.getElementById('statusMessage');
    el.style.display = 'block';
    el.innerText = msg;
    el.className = isProcessing ? 'mt-3 alert alert-warning' : 'mt-3 alert alert-info';
  }

  function onSuccess(res) {
    if (res.success) {
      showStatus("成功しました！ 保存先: " + res.name, false);
      // res.url はドライブのプレビューURL
    } else {
      showStatus("エラー: " + res.error, false);
    }
  }

  function onFailure(e) {
    showStatus("通信エラー: " + e.message, false);
  }
</script>

</body>
</html>
